<title>クラつく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen phone app — info at the top, every control in the thumb zone (sticky sub-nav + fixed dock at the bottom). */
:root {
  --bg: #EEF1EA;        /* daytime programme paper, faint turf tint */
  --surface: #FAFBF7;
  --surface2: #E2E7DE;
  --ink: #16211B;
  --muted: #5B6A61;
  --line: #CDD5CB;
  --accent: #9A6206;    /* floodlight amber, darkened for paper */
  --accent-bg: #E4A72E;
  --on-accent: #1C1405;
  --pitch: #2E6A45;
  --pitch2: #2A6140;
  --pitch-line: rgba(255,255,255,.62);
  --win: #23804B;
  --draw: #7D8780;
  --loss: #B8392F;
  --zone-top: #2F6FB3;
  --led: #F5B43C;       /* scoreboard LED stays a night object in both themes */
  --led-dim: #4A3A16;
  --led-bg: #0D1310;
  --shadow: 0 10px 30px rgba(22,33,27,.14);
  --scrim: rgba(10,16,13,.48);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-led: "DotGothic16", ui-monospace, "Courier New", monospace;
  --dock-h: 124px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1310; --surface: #111D18; --surface2: #182821; --ink: #E5EDE8; --muted: #8DA196; --line: #22352C;
  --accent: #F2B33D; --accent-bg: #F2B33D; --on-accent: #1C1405; --pitch: #1D4A31; --pitch2: #1A432C; --pitch-line: rgba(255,255,255,.45);
  --win: #47BD7B; --draw: #98A39D; --loss: #E36A5F; --zone-top: #6EA6E8; --led-dim: #3B2E12;
  --shadow: 0 10px 30px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1310; --surface: #111D18; --surface2: #182821; --ink: #E5EDE8; --muted: #8DA196; --line: #22352C;
  --accent: #F2B33D; --accent-bg: #F2B33D; --on-accent: #1C1405; --pitch: #1D4A31; --pitch2: #1A432C; --pitch-line: rgba(255,255,255,.45);
  --win: #47BD7B; --draw: #98A39D; --loss: #E36A5F; --zone-top: #6EA6E8; --led-dim: #3B2E12;
  --shadow: 0 10px 30px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }

/* header — read-only info */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 16px 9px; border-bottom: 1px solid var(--line); }
.hdr-club { display: flex; align-items: center; gap: 9px; min-width: 0; }
.hdr-club b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.hdr-date { font-size: 12px; color: var(--muted); line-height: 1.25; }
.hdr-date strong { color: var(--ink); font-weight: 700; font-size: 13px; }
.hdr-money { text-align: right; font-size: 11px; color: var(--muted); line-height: 1.2; }
.hdr-money b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; }
.hdr-money b.neg { color: var(--loss); }

.view { padding: 14px 16px calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.view > * { min-width: 0; }

/* kit badge (no crests — kit colours only) */
.kit { --c1: #888; --c2: #ddd; width: 24px; height: 24px; border-radius: 7px; flex: none; background: linear-gradient(135deg, var(--c1) 0 60%, var(--c2) 60% 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.kit.lg { width: 44px; height: 44px; border-radius: 12px; }
.kit.sm { width: 16px; height: 16px; border-radius: 5px; }

/* dock — the thumb zone */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 8px 12px env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.dock-in { max-width: 520px; margin: 0 auto; display: grid; gap: 6px; }
.go { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 54px; padding: 8px 18px; border-radius: 14px; background: var(--accent-bg); color: var(--on-accent); box-shadow: 0 4px 0 color-mix(in srgb, var(--accent-bg) 55%, #000); transition: transform .08s; }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent-bg) 55%, #000); }
.go b { font-family: var(--f-display); font-weight: 400; font-size: 19px; letter-spacing: .04em; }
.go small { font-size: 12px; font-weight: 700; opacity: .8; text-align: right; line-height: 1.25; }
.go .arrow { font-family: var(--f-display); font-size: 20px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: grid; justify-items: center; gap: 1px; padding: 6px 0 8px; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 10px; position: relative; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 3px; background: var(--accent-bg); }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }

/* sub-nav pinned just above the dock */
.subnav { position: sticky; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); z-index: 10; margin: 4px -16px -14px; padding: 8px 16px 10px; background: linear-gradient(to top, var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface2); border-radius: 12px; }
.seg button { flex: 1; min-height: 40px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* generic */
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card h3, .sec-h { font-family: var(--f-display); font-weight: 400; font-size: 16px; letter-spacing: .02em; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.sec-h small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { min-height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 14px; background: var(--surface2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent-bg); color: var(--on-accent); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--loss); color: var(--loss); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--loss) 16%, transparent); color: var(--loss); }
.chip.ok { background: color-mix(in srgb, var(--win) 16%, transparent); color: var(--win); }
.chip.acc { background: color-mix(in srgb, var(--accent-bg) 22%, transparent); color: var(--accent); }
.pos { display: inline-grid; place-items: center; width: 30px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.pos-GK { background: #B7791F; } .pos-DF { background: #2F6FB3; } .pos-MF { background: #2E8B57; } .pos-FW { background: #C0392B; }
.res { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; }
.res-W { background: var(--win); } .res-D { background: var(--draw); } .res-L { background: var(--loss); }
.ovr { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1; min-width: 2ch; text-align: right; }
.o-elite { color: var(--accent); } .o-good { color: var(--ink); } .o-mid { color: var(--muted); } .o-low { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--win); }
.bar > i.mid { background: var(--accent-bg); } .bar > i.low { background: var(--loss); }
.empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 13px; }

/* ticket — next match */
.ticket { display: grid; grid-template-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.ticket-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--led-bg); color: var(--led); font-family: var(--f-led); font-size: 15px; letter-spacing: .06em; }
.ticket-top span:last-child { color: color-mix(in srgb, var(--led) 70%, #fff); font-size: 13px; }
.ticket-mid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 16px 12px 12px; }
.tside { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.tside b { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.15; }
.tside small { font-size: 12px; color: var(--muted); }
.tside.me b { color: var(--accent); }
.tvs { font-family: var(--f-display); font-size: 14px; color: var(--muted); }
.ticket-perf { border-top: 2px dashed var(--line); margin: 0 14px; position: relative; }
.ticket-perf::before, .ticket-perf::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.ticket-perf::before { left: -24px; } .ticket-perf::after { right: -24px; }
.ticket-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.formline { display: inline-flex; gap: 3px; }

/* board meter */
.meter { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--loss), var(--accent-bg) 45%, var(--win)); opacity: .9; }
.meter i { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 26px 30px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; text-align: left; min-height: 58px; }
.prow .no { font-family: var(--f-led); font-size: 15px; color: var(--muted); text-align: right; }
.prow .nm { min-width: 0; }
.prow .nm b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nm span { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 1px; }
.prow .rt { display: grid; justify-items: end; gap: 4px; width: 52px; }
.prow .no small { color: var(--muted); }
.prow[disabled] { cursor: not-allowed; }
.prow .rt .bar { width: 44px; }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.news li { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.news li time { font-family: var(--f-led); color: var(--muted); font-size: 13px; }
.news li.t-win span::before, .news li.t-loss span::before, .news li.t-draw span::before, .news li.t-transfer span::before, .news li.t-warn span::before, .news li.t-big span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.news li.t-win span::before { background: var(--win); } .news li.t-loss span::before, .news li.t-warn span::before { background: var(--loss); } .news li.t-transfer span::before { background: var(--zone-top); } .news li.t-big span::before { background: var(--accent-bg); }
.news li.t-big span { font-weight: 700; }

/* table */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { text-align: center; width: 30px; }
.tbl td.club { text-align: left; }
.tbl td.club div { display: flex; align-items: center; gap: 7px; font-weight: 700; }
.tbl td.pts { font-weight: 700; font-size: 14px; }
.tbl tr.me td { background: color-mix(in srgb, var(--accent-bg) 14%, transparent); }
.tbl tr.z-top td:first-child { box-shadow: inset 3px 0 0 var(--zone-top); }
.tbl tr.z-champ td:first-child { box-shadow: inset 3px 0 0 var(--accent-bg); }
.tbl tr.z-rel td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* fixtures */
.fx { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 11px 12px; font-size: 14px; }
.fx .h { display: flex; justify-content: flex-end; align-items: center; gap: 7px; text-align: right; font-weight: 700; min-width: 0; }
.fx .a { display: flex; align-items: center; gap: 7px; font-weight: 700; min-width: 0; }
.fx .sc { font-family: var(--f-led); font-size: 17px; min-width: 56px; text-align: center; padding: 2px 6px; border-radius: 6px; background: var(--led-bg); color: var(--led); }
.fx .sc.pending { background: transparent; color: var(--muted); font-family: var(--f-body); font-size: 12px; }
.fx.me { background: color-mix(in srgb, var(--accent-bg) 12%, transparent); }
.roundnav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; }
.roundnav b { text-align: center; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.roundnav small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); }

/* tactics pitch */
.pitch { position: relative; width: 100%; aspect-ratio: 4 / 5.1; max-width: 100%; border-radius: 16px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch) 0 10%, var(--pitch2) 10% 20%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: var(--pitch-line); stroke-width: .5; }
.tok { position: absolute; transform: translate(-50%, -21px); display: grid; justify-items: center; gap: 1px; width: 74px; }
.tok .shirt { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-led); font-size: 17px; border: 3px solid var(--k2); background: var(--k1); color: var(--kt); box-shadow: 0 3px 8px rgba(0,0,0,.35); position: relative; }
.tok .shirt.warn::after { content: "!"; position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%; background: var(--loss); color: #fff; font: 700 11px/17px var(--f-body); text-align: center; }
.tok .lbl { font-size: 11px; line-height: 16px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); padding: 0 6px; border-radius: 5px; max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tok .ov { font-size: 10px; color: rgba(255,255,255,.85); line-height: 1; }
.tok.empty .shirt { background: rgba(255,255,255,.12); border-style: dashed; border-color: rgba(255,255,255,.6); color: #fff; }
.trate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trate div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.trate small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.trate b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.formrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.formrow button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--surface2); font-weight: 700; font-family: var(--f-led); font-size: 16px; color: var(--muted); }
.formrow button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ctlrow { display: grid; gap: 6px; }
.ctlrow label { font-size: 12px; font-weight: 700; color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 100%; text-align: left; }
.toggle .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--surface2); position: relative; flex: none; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.toggle[aria-checked="true"] .sw { background: var(--win); }
.toggle[aria-checked="true"] .sw::after { left: 21px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; transition: opacity .18s; touch-action: none; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 86vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); max-width: 520px; margin: 0 auto; }
.sheet.on { transform: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; flex: 1 1 auto; min-height: 0; }
.sheet-body > * { min-width: 0; flex: none; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.25; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.aptgrid { display: grid; gap: 6px; }
.aprow { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: stretch; }
.apcat { display: grid; place-items: center; border-radius: 8px; color: #fff; font-size: 10px; font-weight: 700; }
.apcells { display: grid; gap: 6px; }
.apc { display: grid; gap: 3px; align-content: center; min-height: 52px; padding: 6px 4px 7px; border-radius: 10px; background: var(--surface2); border: 1.5px solid transparent; text-align: center; color: var(--ink); }
.apc b { font-size: 13px; line-height: 1.1; }
.apc .apv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.1; }
.apbar { height: 4px; margin: 1px 4px 0; background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 2px; overflow: hidden; }
.apbar > i { display: block; height: 100%; background: var(--win); }
.apbar > i.mid { background: var(--accent-bg); } .apbar > i.low { background: var(--loss); }
.apc.own { background: color-mix(in srgb, var(--win) 16%, var(--surface)); }
.apc.own .apv { color: var(--win); font-weight: 700; }
