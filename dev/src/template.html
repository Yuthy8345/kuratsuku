<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen phone app — info at the top, every control in the thumb zone (sticky sub-nav + fixed dock at the bottom).
   Look: the manager's tactics board. Default = green chalkboard; data-board="white" = magnetic whiteboard.
   Clubs appear as magnets in their kit colours, buttons are magnet plates, labels are chalk notes. */
:root {
  --bg: #163428;        /* chalkboard */
  --surface: #1C3F30;
  --surface2: #24503D;
  --ink: #F2EFE4;       /* chalk */
  --muted: #A9BCAF;
  --line: rgba(242,239,228,.15);
  --accent: #F2C230;    /* yellow chalk / marker */
  --accent-bg: #F2C230;
  --on-accent: #1F1A08;
  --plate-edge: #A68319;
  --pitch: #18392B;
  --pitch2: #1A3D2E;
  --pitch-line: rgba(242,239,228,.5);
  --pitch-ink: rgba(242,239,228,.9);
  --win: #5CCB8A;
  --draw: #A9B5AD;
  --loss: #FF7B6B;
  --zone-top: #7FB2FF;
  --own: #2F6FD6;       /* our magnets */
  --led: #F5B43C;       /* stadium scoreboard */
  --led-dim: #3B2E12;
  --led-bg: #0D1310;
  --frame: linear-gradient(90deg, #8C9298 0%, #D7DBDF 28%, #9EA4AA 55%, #C9CDD1 78%, #8C9298 100%);
  --tex: radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 42%), radial-gradient(ellipse at 82% 62%, rgba(255,255,255,.04) 0%, rgba(255,255,255,0) 46%), radial-gradient(circle, rgba(255,255,255,.028) 0 1px, rgba(255,255,255,0) 1.4px);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --mag-shadow: 0 3px 0 rgba(0,0,0,.32);
  --scrim: rgba(3,10,7,.62);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-chalk: "Yusei Magic", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --f-led: "DotGothic16", ui-monospace, "Courier New", monospace;
  --dock-h: 124px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); /* notch / home bar (the PWA shell already pads :root by these) */
  color-scheme: dark;
}
:root[data-board="white"] {
  --bg: #F3F5F6; --surface: #FFFFFF; --surface2: #EBEFF2; --ink: #18233A; --muted: #5A6678; --line: #D5DCE2;
  --accent: #8A6500; --accent-bg: #F2C230; --on-accent: #1F1A08; --plate-edge: #B8921E;
  --pitch: #FBFCFB; --pitch2: #F3F7F4; --pitch-line: rgba(30,110,70,.55); --pitch-ink: #24402F;
  --win: #1F8A4C; --draw: #7D8790; --loss: #C23A2E; --zone-top: #2F6FD6; --led-dim: #4A3A16;
  --tex: radial-gradient(ellipse at 20% 12%, rgba(24,35,58,.035) 0%, rgba(24,35,58,0) 40%), radial-gradient(ellipse at 78% 66%, rgba(24,35,58,.03) 0%, rgba(24,35,58,0) 44%);
  --shadow: 0 10px 30px rgba(24,35,58,.16); --mag-shadow: 0 3px 0 rgba(24,35,58,.22); --scrim: rgba(12,18,30,.45); color-scheme: light;
}
html, body { height: 100%; }
body { background-color: var(--bg); background-image: var(--tex); background-size: auto, auto, 4px 4px; background-attachment: fixed; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }

/* header — read-only info */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 16px 9px; }
.hdr::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: var(--frame); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.hdr-club { display: flex; align-items: center; gap: 9px; min-width: 0; }
.hdr-club b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.hdr-date { font-size: 12px; color: var(--muted); line-height: 1.25; }
.hdr-date strong { color: var(--ink); font-weight: 700; font-size: 13px; }
.hdr-money { text-align: right; font-size: 11px; color: var(--muted); line-height: 1.2; }
.hdr-money b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; }
.hdr-money b.neg { color: var(--loss); }

.view { padding: 14px 16px calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.view > * { min-width: 0; }

/* kit badge (no crests — kit colours only) */
/* every club is a magnet in its kit colours */
.kit { --c1: #888; --c2: #ddd; width: 24px; height: 24px; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 46%), var(--c1); box-shadow: inset 0 0 0 3px var(--c2), inset 0 0 0 4px rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.3); }
.kit.lg { width: 44px; height: 44px; box-shadow: inset 0 0 0 5px var(--c2), inset 0 0 0 6px rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.3); }
.kit.sm { width: 16px; height: 16px; box-shadow: inset 0 0 0 2px var(--c2), 0 1px 0 rgba(0,0,0,.3); }

/* dock — the thumb zone */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 12px env(safe-area-inset-bottom, 0px); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.dock::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--frame); box-shadow: 0 -1px 2px rgba(0,0,0,.25); }
.dock-in { max-width: 520px; margin: 0 auto; display: grid; gap: 6px; }
.go { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 54px; padding: 8px 18px; border-radius: 10px; background: var(--accent-bg); color: var(--on-accent); box-shadow: 0 4px 0 var(--plate-edge), 0 8px 18px rgba(0,0,0,.22); transition: transform .08s; }
.go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--plate-edge); }
.go b { font-family: var(--f-display); font-weight: 400; font-size: 19px; letter-spacing: .04em; }
.go small { font-size: 12px; font-weight: 700; opacity: .8; text-align: right; line-height: 1.25; }
.go .arrow { font-family: var(--f-display); font-size: 20px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: grid; justify-items: center; gap: 1px; padding: 6px 0 8px; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 10px; position: relative; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: -1px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 50%), var(--accent-bg); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }

/* sub-nav pinned just above the dock */
.subnav { position: sticky; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); z-index: 10; margin: 4px -16px -14px; padding: 8px 16px 10px; background: linear-gradient(to top, var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.seg { display: flex; gap: 4px; padding: 4px; background: color-mix(in srgb, var(--surface2) 80%, #000 6%); border-radius: 10px; box-shadow: inset 0 1px 3px rgba(0,0,0,.25); }
.seg button { flex: 1; min-height: 40px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: var(--mag-shadow); }

/* generic */
.eyebrow { font-family: var(--f-chalk); font-size: 14px; color: var(--muted); font-weight: 400; line-height: 1.3; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h3, .sec-h { font-family: var(--f-display); font-weight: 400; font-size: 16px; letter-spacing: .02em; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.sec-h small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
/* buttons are magnet plates: a solid face and a short drop edge that sinks when pressed */
.btn { min-height: 46px; padding: 0 16px; border-radius: 10px; font-weight: 700; font-size: 14px; background: var(--surface2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--mag-shadow); transition: transform .06s; }
.btn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.btn.primary { background: var(--accent-bg); color: var(--on-accent); font-weight: 900; box-shadow: 0 3px 0 var(--plate-edge); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); box-shadow: none; }
.btn.danger { background: transparent; border: 1px solid var(--loss); color: var(--loss); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--loss) 16%, transparent); color: var(--loss); }
.chip.ok { background: color-mix(in srgb, var(--win) 16%, transparent); color: var(--win); }
.chip.acc { background: color-mix(in srgb, var(--accent-bg) 22%, transparent); color: var(--accent); }
.pos { display: inline-grid; place-items: center; width: 30px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.pos-GK { background: #B7791F; } .pos-DF { background: #2F6FB3; } .pos-MF { background: #2E8B57; } .pos-FW { background: #C0392B; }
.res { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; }
.res-W { background: var(--win); } .res-D { background: var(--draw); } .res-L { background: var(--loss); }
.ovr { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1; min-width: 2ch; text-align: right; }
.o-elite { color: var(--accent); } .o-good { color: var(--ink); } .o-mid { color: var(--muted); } .o-low { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--win); }
.bar > i.mid { background: var(--accent-bg); } .bar > i.low { background: var(--loss); }
.empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 13px; }

/* ticket — next match */
.ticket { display: grid; grid-template-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.ticket-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface2); color: var(--accent); font-family: var(--f-display); font-size: 14px; letter-spacing: .08em; border-bottom: 1px dashed var(--line); }
.ticket-top span:last-child { color: var(--muted); font-family: var(--f-body); font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.ticket-mid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; padding: 16px 12px 12px; }
.tside { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.tside b { font-family: var(--f-display); font-weight: 400; font-size: 18px; line-height: 1.15; }
.tside small { font-size: 12px; color: var(--muted); }
.tside.me b { color: var(--accent); }
.tvs { font-family: var(--f-display); font-size: 14px; color: var(--muted); }
.ticket-perf { border-top: 2px dashed var(--line); margin: 0 14px; position: relative; }
.ticket-perf::before, .ticket-perf::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.ticket-perf::before { left: -24px; } .ticket-perf::after { right: -24px; }
.ticket-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.ticket-story { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
.ticket.cup .ticket-top { background: linear-gradient(90deg, var(--surface2), color-mix(in srgb, var(--accent-bg) 24%, var(--surface2))); }
.chip.story { background: color-mix(in srgb, var(--accent-bg) 20%, transparent); color: var(--accent); }
.chip.fire { background: linear-gradient(90deg, #ff9a1f, #ff5a1f); color: #fff; }
.card.fire { border-color: color-mix(in srgb, #ff7a1f 55%, var(--line)); background: color-mix(in srgb, #ff7a1f 8%, var(--surface)); padding: 10px 12px; }
.card.fire .eyebrow { color: #e0601a; }
.card.fire ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.card.fire li .chip { margin-left: 6px; }
.cuphead { display: grid; gap: 8px; }
.formline { display: inline-flex; gap: 3px; }

/* board meter */
.meter { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--loss), var(--accent-bg) 45%, var(--win)); opacity: .9; }
.meter i { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 26px 30px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; text-align: left; min-height: 58px; }
.prow .no { font-family: var(--f-body); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); text-align: right; }
.prow .nm { min-width: 0; }
.prow .nm b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nm span { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 1px; }
.prow .rt { display: grid; justify-items: end; gap: 4px; width: 52px; }
.prow .no small { color: var(--muted); }
.prow[disabled] { cursor: not-allowed; }
.prow .nm .sl-last { display: block; margin-top: 4px; font-size: 12px; line-height: 1.45; color: var(--ink); opacity: .82; } /* shortlist: last bid and how it went */
.prow .rt .bar { width: 44px; }
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.news li { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.news li time { font-family: var(--f-body); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.news li.t-win span::before, .news li.t-loss span::before, .news li.t-draw span::before, .news li.t-transfer span::before, .news li.t-warn span::before, .news li.t-big span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.news li.t-win span::before { background: var(--win); } .news li.t-loss span::before, .news li.t-warn span::before { background: var(--loss); } .news li.t-transfer span::before { background: var(--zone-top); } .news li.t-big span::before { background: var(--accent-bg); }
.news li.t-big span { font-weight: 700; }

/* table */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { font-size: 11px; color: var(--muted); font-weight: 700; padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { text-align: center; width: 30px; }
.tbl td.club { text-align: left; }
.tbl td.club div { display: flex; align-items: center; gap: 7px; font-weight: 700; }
.tbl td.pts { font-weight: 700; font-size: 14px; }
.tbl tr.me td { background: color-mix(in srgb, var(--accent-bg) 14%, transparent); }
.tbl tr.z-top td:first-child { box-shadow: inset 3px 0 0 var(--zone-top); }
.tbl tr.z-champ td:first-child { box-shadow: inset 3px 0 0 var(--accent-bg); }
.tbl tr.z-rel td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* fixtures */
.fx { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 11px 12px; font-size: 14px; }
.fx .h { display: flex; justify-content: flex-end; align-items: center; gap: 7px; text-align: right; font-weight: 700; min-width: 0; }
.fx .a { display: flex; align-items: center; gap: 7px; font-weight: 700; min-width: 0; }
.fx .sc { font-family: var(--f-led); font-size: 17px; min-width: 56px; text-align: center; padding: 2px 6px; border-radius: 6px; background: var(--led-bg); color: var(--led); }
.fx .sc.pending { background: transparent; color: var(--muted); font-family: var(--f-body); font-size: 12px; }
.fx .sc small { display: block; font-size: 10px; line-height: 1.1; color: color-mix(in srgb, var(--led) 75%, #fff); }
.fx .h small, .fx .a small { font-size: 9px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }
.fx .h.win, .fx .a.win { text-decoration: underline; text-decoration-color: var(--accent-bg); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.fx.me { background: color-mix(in srgb, var(--accent-bg) 12%, transparent); }
.roundnav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; }
.roundnav b { text-align: center; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.roundnav small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); }

/* tactics pitch */
.pitch { position: relative; width: 100%; aspect-ratio: 4 / 5.1; max-width: 100%; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--pitch) 0 10%, var(--pitch2) 10% 20%); box-shadow: inset 0 0 0 1px var(--line), inset 0 0 40px rgba(0,0,0,.18); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: var(--pitch-line); stroke-width: .55; stroke-linecap: round; }
.tok { position: absolute; transform: translate(-50%, -21px); display: grid; justify-items: center; gap: 1px; width: 74px; }
.tok .shirt { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-body); font-weight: 900; font-size: 15px; border: 3px solid var(--k2); background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.4) 0%, rgba(255,255,255,0) 48%), var(--k1); color: var(--kt); box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 10px rgba(0,0,0,.25); position: relative; }
.tok .shirt.warn::after { content: "!"; position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%; background: var(--loss); color: #fff; font: 700 11px/17px var(--f-body); text-align: center; }
.tok .lbl { font-size: 11px; line-height: 16px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); padding: 0 6px; border-radius: 5px; max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tok .ov { font-size: 10px; color: var(--pitch-ink); line-height: 1; font-weight: 700; }
.tok.hot .shirt { box-shadow: 0 0 0 3px rgba(255,140,30,.85), 0 0 18px 6px rgba(255,110,20,.55); }
.tok.hot .ov::before { content: "燃"; display: inline-block; margin-right: 3px; padding: 0 3px; border-radius: 3px; background: #ff6a1f; color: #fff; font-weight: 700; }
.tok.out .shirt { background: repeating-linear-gradient(135deg, #5a5f5c 0 5px, #474b49 5px 10px); border-color: var(--loss); color: #fff; opacity: .9; }
.tok.out .shirt::after { content: "×"; position: absolute; top: -6px; right: -6px; width: 17px; height: 17px; border-radius: 50%; background: var(--loss); color: #fff; font: 700 12px/17px var(--f-body); text-align: center; }
.tok.out .lbl { text-decoration: line-through; }
.tok.out .ov { color: #fff; background: var(--loss); padding: 2px 5px; border-radius: 4px; font-weight: 700; }
.card.alert { border-color: color-mix(in srgb, var(--loss) 55%, var(--line)); background: color-mix(in srgb, var(--loss) 8%, var(--surface)); padding: 10px 12px; }
.card.alert .eyebrow { color: var(--loss); }
.card.alert ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.prow.addrow { grid-template-columns: 26px 1fr; color: var(--muted); }
.prow.addrow .no { font-size: 20px; color: var(--accent); }
.tok.empty .shirt { background: transparent; border-style: dashed; border-color: var(--pitch-ink); color: var(--pitch-ink); box-shadow: none; }
.trate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.trate div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.trate small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.trate b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.formrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.formrow button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--surface2); font-weight: 400; font-family: var(--f-display); font-size: 15px; letter-spacing: .02em; color: var(--muted); }
.formrow button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: var(--mag-shadow); }
.ctlrow { display: grid; gap: 6px; }
.ctlrow label { font-size: 12px; font-weight: 700; color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 100%; text-align: left; }
.toggle .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--surface2); position: relative; flex: none; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 50%), #E8E6DD; box-shadow: 0 2px 0 rgba(0,0,0,.3); transition: left .15s; }
.toggle[aria-checked="true"] .sw { background: var(--win); }
.toggle[aria-checked="true"] .sw::after { left: 21px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; transition: opacity .18s; touch-action: none; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 86%; display: flex; flex-direction: column; background-color: var(--bg); background-image: var(--tex); background-size: auto, auto, 4px 4px; border-radius: 16px 16px 0 0; border-top: 3px solid #C9CDD1; box-shadow: var(--shadow); transform: translateY(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); max-width: 520px; margin: 0 auto; }
.sheet.on { transform: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; flex: 1 1 auto; min-height: 0; }
.sheet-body > * { min-width: 0; flex: none; }
.sheet-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: grid; gap: 8px; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.25; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.aptgrid { display: grid; gap: 6px; }
.aprow { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: stretch; }
.apcat { display: grid; place-items: center; border-radius: 8px; color: #fff; font-size: 10px; font-weight: 700; }
.apcells { display: grid; gap: 6px; }
.apc { display: grid; gap: 3px; align-content: center; min-height: 52px; padding: 6px 4px 7px; border-radius: 10px; background: var(--surface2); border: 1.5px solid transparent; text-align: center; color: var(--ink); }
.apc b { font-size: 13px; line-height: 1.1; }
.apc .apv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.1; }
.apbar { height: 4px; margin: 1px 4px 0; background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 2px; overflow: hidden; }
.apbar > i { display: block; height: 100%; background: var(--win); }
.apbar > i.mid { background: var(--accent-bg); } .apbar > i.low { background: var(--loss); }
.apc.own { background: color-mix(in srgb, var(--win) 16%, var(--surface)); }
.apc.own .apv { color: var(--win); font-weight: 700; }
.apc.on { border-color: var(--accent-bg); background: color-mix(in srgb, var(--accent-bg) 16%, var(--surface)); }
.apc.on .apv { color: var(--accent); font-weight: 700; }
button.apc:disabled { opacity: 1; cursor: default; }
button.apc:not(:disabled):active { transform: scale(.97); }
.attr { display: grid; grid-template-columns: 76px 1fr 28px auto; align-items: center; gap: 10px; font-size: 13px; }
.dlt { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 36px; text-align: right; }
.dlt.up { color: var(--win); } .dlt.dn { color: var(--loss); }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.menu button { display: grid; gap: 1px; text-align: left; padding: 9px 12px; min-height: 56px; border-radius: 12px; background: var(--surface2); border: 2px solid transparent; }
.menu button b { font-size: 14px; }
.menu button span { font-size: 11px; color: var(--muted); line-height: 1.35; }
.menu button[aria-pressed="true"] { border-color: var(--accent-bg); background: color-mix(in srgb, var(--accent-bg) 16%, var(--surface)); }
.seg button[disabled] { opacity: .45; }
.attr .bar { height: 7px; }
.attr b { text-align: right; font-variant-numeric: tabular-nums; }
/* farewell pop-up for a retiring player: a night stadium with camera flashes */
.farewell { position: relative; overflow: hidden; border-radius: 16px; padding: 14px 16px 18px; text-align: center; color: #fff;
  background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--k1) 55%, #0b1410) 0%, #0b1410 62%), #0b1410; }
.farewell::before { content: ""; position: absolute; inset: auto 0 0 0; height: 42%; background: linear-gradient(0deg, rgba(46,106,69,.38), rgba(46,106,69,0)); pointer-events: none; }
.fw-lights { position: absolute; inset: 0; pointer-events: none; }
.fw-lights i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 3px rgba(255,255,255,.65); opacity: 0; animation: fwflash 2.8s infinite; }
.fw-lights i:nth-child(1) { left: 8%; top: 14%; animation-delay: .1s; } .fw-lights i:nth-child(2) { left: 22%; top: 8%; animation-delay: 1.3s; }
.fw-lights i:nth-child(3) { left: 36%; top: 18%; animation-delay: .7s; } .fw-lights i:nth-child(4) { left: 64%; top: 10%; animation-delay: 2.1s; }
.fw-lights i:nth-child(5) { left: 78%; top: 16%; animation-delay: .4s; } .fw-lights i:nth-child(6) { left: 92%; top: 9%; animation-delay: 1.7s; }
.fw-lights i:nth-child(7) { left: 12%; top: 34%; animation-delay: 2.4s; } .fw-lights i:nth-child(8) { left: 88%; top: 30%; animation-delay: .9s; }
.fw-lights i:nth-child(9) { left: 5%; top: 52%; animation-delay: 1.9s; } .fw-lights i:nth-child(10) { left: 95%; top: 48%; animation-delay: .2s; }
.fw-lights i:nth-child(11) { left: 50%; top: 5%; animation-delay: 1.1s; } .fw-lights i:nth-child(12) { left: 28%; top: 30%; animation-delay: 2.6s; }
.fw-lights i:nth-child(13) { left: 72%; top: 28%; animation-delay: 1.5s; } .fw-lights i:nth-child(14) { left: 44%; top: 26%; animation-delay: .5s; }
@keyframes fwflash { 0%, 86%, 100% { opacity: 0; transform: scale(.6); } 89% { opacity: 1; transform: scale(1.3); } 93% { opacity: .2; } }
.fw-head { position: relative; display: flex; justify-content: space-between; font-family: var(--f-led); font-size: 13px; color: var(--led); letter-spacing: .06em; }
.fw-shirt { position: relative; margin: 14px auto 8px; width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-led); font-size: 40px;
  background: var(--k1); color: var(--kt); border: 5px solid var(--k2); box-shadow: 0 0 0 4px rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.5), 0 0 40px color-mix(in srgb, var(--k1) 60%, transparent); }
.fw-tag { position: relative; display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .3em; padding: 3px 4px 3px 10px; color: var(--led); border-top: 1px solid color-mix(in srgb, var(--led) 50%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--led) 50%, transparent); }
.farewell h2.fw-name { position: relative; margin: 10px 0 2px; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.2; color: #fff; }
.fw-sub { position: relative; font-size: 12px; color: rgba(255,255,255,.72); }
.fw-msg { position: relative; margin: 12px 0 0; font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.92); text-wrap: balance; }
.preset { display: grid; gap: 6px; padding: 12px; }
.preset-xi { color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.preset-act { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 6px; margin-top: 2px; }
.preset-act .btn { min-height: 40px; padding: 0 6px; font-size: 13px; white-space: nowrap; }
.preset-act .btn.danger { border-color: var(--loss); color: var(--loss); }
.statgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
.statgrid div { background: var(--surface2); border-radius: 10px; padding: 6px 2px; }
.statgrid small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; }
.statgrid b { font-size: 17px; font-variant-numeric: tabular-nums; }
/* growth chart (成長の記録): chalk lines on the board */
.gchart { display: block; width: 100%; height: auto; overflow: visible; }
.gchart .gc-ax { stroke: var(--line); stroke-width: 1.2; }
.gchart .gc-ovr { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gchart .gc-pot { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; stroke-linecap: round; }
.gchart .gc-tg { stroke: var(--win); stroke-width: 1.6; stroke-dasharray: .5 4.5; stroke-linecap: round; }
.gchart .gc-dot { fill: var(--accent); }
.gchart text { font-family: var(--f-body); font-size: 10.5px; fill: var(--muted); font-weight: 700; }
.gchart .gc-v { fill: var(--ink); font-size: 13px; }
.gchart .gc-tl { fill: var(--win); }
.gc-leg { display: flex; gap: 14px; flex-wrap: wrap; margin-top: -2px; }
.gc-leg span { display: inline-flex; align-items: center; gap: 5px; }
.gc-leg i { display: inline-block; width: 18px; height: 0; border-top: 2.6px solid var(--accent); border-radius: 2px; }
.gc-leg i.l-pot { border-top: 1.6px dashed var(--muted); }
.gc-leg i.l-tg { border-top: 2px dotted var(--win); }
.bigovr { display: flex; align-items: flex-end; gap: 14px; }
.bigovr .ovr { font-size: 48px; }
.cmp { display: grid; grid-template-columns: 40px 1fr 70px 1fr 40px; align-items: center; gap: 6px; font-size: 13px; }
.cmp b { font-variant-numeric: tabular-nums; }
.cmp .l { text-align: right; } .cmp .lab { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }
.cmp .bl { direction: rtl; }
.input { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); font: inherit; font-size: 16px; box-shadow: inset 0 1px 3px rgba(0,0,0,.2); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* title: the tactics board itself (always the green chalkboard in its aluminium frame) */
/* exactly one screen, pinned with position:fixed. No vh/dvh: in an iOS home-screen app with viewport-fit=cover they come out
   short by the notch at launch and only correct themselves after a scroll (WebKit bug 254868). Same 10px frame above and below the
   board: the board runs on under the home bar (only the links and buttons keep clear of it). */
.tb-wrap { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--sat) + 10px) max(10px, env(safe-area-inset-right, 0px)) 10px max(10px, env(safe-area-inset-left, 0px)); background: linear-gradient(135deg, #D7DBDF 0%, #9EA4AA 45%, #C9CDD1 70%, #8C9298 100%); display: flex; }
/* iOS home-screen app (html.ios-app, set in app.js): at launch iOS can report a viewport short by the status bar (WebKit
   bug 301994) and draws nothing below it, but uses the right height whenever the page is taller than the screen. So
   there the title always sits in the page at the real screen height + 1px (--apph) instead of being fixed. */
html.ios-app .tb-wrap { position: absolute; inset: 0 0 auto 0; height: calc(var(--apph) + 1px); overflow: hidden; }
.tboard { position: relative; flex: 1; width: 100%; max-width: 520px; min-height: 440px; margin: 0 auto; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; color: #F4F1E6;
  background-color: #1E4A39; background-image: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 40%), radial-gradient(ellipse at 75% 70%, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 45%), radial-gradient(circle, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,0) 1.4px); background-size: auto, auto, 4px 4px;
  box-shadow: inset 0 0 0 2px #163A2C, inset 0 0 60px rgba(0,0,0,.45); }
/* the whole board is the pitch; magnets and chalk use the 362x816 design board in % */
.tb-pitch { position: absolute; inset: 0; --ms: clamp(26px, 8.6vw, 34px); }
.tb-lines, .tb-arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tb-lines * { fill: none; stroke: rgba(244,241,230,.4); stroke-width: 2; vector-effect: non-scaling-stroke; }
.tb-circle { position: absolute; left: 50%; top: 50%; width: 27.6%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(244,241,230,.4); border-radius: 50%; }
.tb-circle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(244,241,230,.5); }
.tb-arrows path, .tb-arrows ellipse { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.tb-arrows .w { stroke: rgba(244,241,230,.9); }           /* my team: white chalk */
.tb-arrows .y { stroke: rgba(242,194,48,.95); }           /* opponent: yellow chalk */
.tb-arrows .ds { stroke-dasharray: 7 6; }                 /* pass */
.tb-arrows .dl { stroke-dasharray: 11 6; }                /* defensive line */
.tb-arrows .dt { stroke-dasharray: .5 6.5; stroke-width: 3; } /* marking */
.tb-arrows .pr { stroke-width: 3.2; }                     /* press */
.tb-arrows .zone { fill: rgba(242,194,48,.08); stroke-width: 2; stroke-dasharray: 5 5; }
.mag { position: absolute; width: var(--ms); height: var(--ms); margin: calc(var(--ms) / -2) 0 0 calc(var(--ms) / -2); border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--f-body); box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 10px rgba(0,0,0,.2); }
.mag.own { background: radial-gradient(circle at 35% 30%, #74A3F3 0%, #2F6FD6 55%, #1C4A9C 100%); color: #fff; }
.mag.opp { background: radial-gradient(circle at 35% 30%, #FFE68A 0%, #F2C230 55%, #B38A12 100%); color: #3A2E00; }
/* the board is dimmed so the logo and the buttons come to the front */
.tb-dim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 64% 15% at 50% 25%, rgba(9,25,19,.55) 0%, rgba(9,25,19,0) 100%), linear-gradient(180deg, rgba(9,25,19,0) 58%, rgba(9,25,19,.4) 80%, rgba(9,25,19,.5) 100%), rgba(10,27,21,.36); }
.tb-logo { position: absolute; left: 0; right: 0; top: 16.5%; z-index: 1; display: grid; justify-items: center; pointer-events: none; }
.tb-logo h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(56px, 18.5vw, 78px); line-height: 1.05; color: #F4F1E6; transform: rotate(-4deg); text-shadow: 0 0 1px rgba(244,241,230,.8), 2px 3px 0 rgba(0,0,0,.3), 0 0 22px rgba(8,22,17,.85); letter-spacing: .01em; }
.tb-logo svg { width: 60%; max-width: 250px; height: auto; transform: rotate(-4deg); margin-top: 2px; }
.tb-menu { position: relative; z-index: 1; padding: 0 6.6% max(16px, calc(var(--sab) + 8px)); /* the board runs under the home bar, the links stay above it */ display: grid; gap: 12px; }
.tb-menu .plate { margin: 0 7%; }
.plate { display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 8px 18px; border-radius: 10px; text-align: left; font-family: var(--f-body); transition: transform .06s; }
.plate b { display: block; font-size: 19px; font-weight: 900; letter-spacing: .06em; line-height: 1.3; }
.plate small { display: block; font-size: 12px; font-weight: 700; opacity: .78; }
.plate.yellow { background: #F2C230; color: #1F1A08; box-shadow: 0 4px 0 #A68319, 0 10px 24px rgba(0,0,0,.35); }
.plate.chalk { min-height: 56px; background: #F4F1E6; color: #1E2A24; box-shadow: 0 4px 0 #B9B4A2, 0 10px 24px rgba(0,0,0,.3); }
.plate.chalk b { font-size: 16px; }
.plate:active { transform: translateY(3px); }
.plate.yellow:active { box-shadow: 0 1px 0 #A68319; } .plate.chalk:active { box-shadow: 0 1px 0 #B9B4A2; }
.mag-dot { --c1: #888; --c2: #ddd; width: 24px; height: 24px; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 48%), var(--c1); box-shadow: inset 0 0 0 3px var(--c2), inset 0 0 0 4px rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.3); }
.newmag { display: inline-grid; place-items: center; flex: none; width: 38px; height: 24px; border-radius: 5px; background: linear-gradient(180deg, #4A86E6 0%, #2459B8 100%); color: #fff; font: 900 10px/1 var(--f-body); letter-spacing: .08em; box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); }
.tb-links { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 2px; }
.tb-links button { min-height: 40px; font-family: var(--f-chalk); font-size: 14px; color: #F4F1E6; text-shadow: 0 1px 3px rgba(0,0,0,.6); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(244,241,230,.5); }
.tb-links .about { font-family: var(--f-body); font-size: 12px; font-weight: 700; color: rgba(244,241,230,.72); }
.tboard button:focus-visible { outline: 2px solid #F2C230; outline-offset: 3px; }

/* club select */
.title { min-height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 0 16px; max-width: 520px; margin: 0 auto; }
.title-top { padding: 36px 0 20px; display: grid; gap: 22px; align-content: start; }
.title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 14vw, 64px); line-height: 1; letter-spacing: .02em; }
.title .lede { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.led { background: var(--led-bg); color: var(--led); font-family: var(--f-led); border-radius: 14px; padding: 16px; display: grid; gap: 6px; text-shadow: 0 0 10px color-mix(in srgb, var(--led) 45%, transparent); position: relative; overflow: hidden; }
.led::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px); background-size: 4px 4px; pointer-events: none; }
.led .big { font-size: 44px; line-height: 1; letter-spacing: .04em; }
.led .ln { display: flex; justify-content: space-between; font-size: 15px; }
.led .ln span:last-child { color: color-mix(in srgb, var(--led) 65%, #fff); }
.fine { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }
.title-actions { display: grid; gap: 8px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 80%, transparent); }
.title-actions .btn { min-height: 56px; font-size: 16px; }
.crow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 12px; text-align: left; }
.crow b { font-family: var(--f-display); font-weight: 400; font-size: 16px; display: block; line-height: 1.3; }
.crow span { font-size: 12px; color: var(--muted); }
.stars { font-size: 12px; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
.select-head { padding: 22px 0 6px; display: grid; gap: 4px; }
.select-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; }

/* match overlay */
.match { position: fixed; inset: 0; z-index: 50; background-color: var(--bg); background-image: var(--tex); background-size: auto, auto, 4px 4px; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.match-in { max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; min-height: 0; }
.sb { margin: 10px 12px 0; background: var(--led-bg); border-radius: 14px; padding: 10px 12px; color: var(--led); font-family: var(--f-led); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; text-shadow: 0 0 10px color-mix(in srgb, var(--led) 45%, transparent); position: relative; overflow: hidden; }
.sb::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px); background-size: 4px 4px; pointer-events: none; }
.sb .team { display: grid; gap: 2px; font-size: 15px; letter-spacing: .04em; }
.sb .team:last-child { text-align: right; justify-items: end; }
.sb .team .kitline { width: 34px; height: 4px; border-radius: 2px; }
.sb .score { font-size: 44px; line-height: 1; letter-spacing: .06em; text-align: center; }
.sb .clock { font-size: 15px; text-align: center; color: color-mix(in srgb, var(--led) 70%, #fff); }
.sb.flash .score { animation: flash .9s steps(2) 3; }
@keyframes flash { 50% { opacity: .15; } }
.pitch2d { margin: 10px 12px 0; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--pitch); flex: none; }
.pitch2d canvas { width: 100%; height: 100%; display: block; }
.possbar { margin: 8px 12px 0; display: grid; grid-template-columns: 34px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
.possbar .pb { height: 6px; border-radius: 3px; overflow: hidden; display: flex; background: var(--surface2); }
.possbar .pb i { display: block; height: 100%; }
.possbar span:last-child { text-align: right; }
.feed { list-style: none; margin: 8px 0 0; padding: 0 12px; overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; display: grid; align-content: start; gap: 0; }
.feed li { display: grid; grid-template-columns: 40px 6px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; animation: rise .25s ease-out; }
.feed li time { font-family: var(--f-led); color: var(--muted); font-size: 14px; text-align: right; }
.feed li .pip { width: 6px; height: 22px; border-radius: 3px; background: var(--line); }
.feed li.goal { font-weight: 700; }
.feed li.goal span { color: var(--accent); }
.feed li.red span { color: var(--loss); }
.feed li.sys span { color: var(--muted); font-weight: 700; }
.feed li.hot span { color: #e0601a; font-weight: 700; }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } }
.mctl { padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 3px solid #B9BEC3; display: grid; gap: 8px; background: var(--bg); }
.mctl .row > * { flex: 1; }
.result { overflow-y: auto; overscroll-behavior: contain; flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.result > * { flex: none; min-width: 0; }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
.scorers > div:last-child { text-align: right; }
.stline { display: grid; grid-template-columns: 50px 1fr 50px; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stline span:nth-child(2) { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }
.stline span:last-child { text-align: right; }
.evb { display: inline-block; font-family: var(--f-led); font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; margin-right: 6px; background: var(--accent-bg); color: var(--on-accent); vertical-align: 1px; font-weight: 400; }
.evb.a { background: var(--surface2); color: var(--ink); }
.cardi { display: inline-block; width: 9px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.cardi.y { background: #F2C200; } .cardi.r { background: #D3302A; }
.rating { font-family: var(--f-led); font-size: 16px; min-width: 34px; text-align: center; border-radius: 6px; padding: 1px 4px; background: var(--surface2); }
.rating.hi { background: color-mix(in srgb, var(--win) 22%, transparent); color: var(--win); }
.rating.lo { background: color-mix(in srgb, var(--loss) 18%, transparent); color: var(--loss); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
